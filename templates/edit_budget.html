{% extends "base.html" %}

{% block title %}Edit Budget - MoneyLens{% endblock %}

{% block content %}

<div class="edit-budget-page">

    <section class="edit-budget-card">

        <!-- Page Header -->
        <div class="edit-budget-header">

            <h1>Edit Budget</h1>

            <p>
                Update your budget details below.
            </p>

        </div>


        <!-- Edit Budget Form -->
        <form method="POST" class="edit-budget-form">

            <div class="budget-form-group">

                <label for="category">
                    Category
                </label>

                <input
                    id="category"
                    type="text"
                    name="category"
                    value="{{ budget.category }}"
                    required
                >

            </div>


            <div class="budget-form-group">

                <label for="month">
                    Month
                </label>

                <input
                    id="month"
                    type="number"
                    name="month"
                    value="{{ budget.month }}"
                    min="1"
                    max="12"
                    required
                >

            </div>


            <div class="budget-form-group">

                <label for="year">
                    Year
                </label>

                <input
                    id="year"
                    type="number"
                    name="year"
                    value="{{ budget.year }}"
                    min="2020"
                    required
                >

            </div>


            <div class="budget-form-group">

                <label for="amount">
                    Budget Amount
                </label>

                <input
                    id="amount"
                    type="number"
                    name="amount"
                    value="{{ budget.amount }}"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>


            <div class="edit-budget-actions">

                <button
                    type="submit"
                    class="primary-button"
                >
                    Update Budget
                </button>

                <a
                    href="{{ url_for('budgets') }}"
                    class="edit-budget-cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </section>

</div>

{% endblock %}
