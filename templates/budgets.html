<h1>My Budgets</h1>


<form method="POST">
    <input type="text" name="category" placeholder="Category" required>
    <input type="number" name="month" placeholder="Month (1-12)" min="1" max="12" required>
    <input type="number" name="year" placeholder="Year" min="2020" required>
    <input type="number" name="amount" placeholder="Amount" min="0.01" step="0.01" required>
    <button type="submit">Add Budget</button>
</form>

{% for budget in budgets %}
    <div class="budget-item">
        <strong>{{ budget.category }}</strong>
        <span>{{ budget.month }}/{{ budget.year }}</span>
        <span>₹{{ budget.amount }}</span>

        <a href="{{ url_for('edit_budget', budget_id=budget.id) }}">Edit</a>

        <form method="POST" action="{{ url_for('delete_budget', budget_id=budget.id) }}">
            <button type="submit">Delete</button>
        </form>
    </div>
{% endfor %}
