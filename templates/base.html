<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}MoneyLens{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- =========================================================
         MoneyLens Global Navigation
         ========================================================= -->

    <header class="site-header">

        <div class="site-brand">

            <a
                href="{{ url_for('dashboard') }}"
                class="site-brand-link"
            >

                <!-- MoneyLens logo -->
                <span
                    class="site-brand-logo"
                    aria-label="MoneyLens logo"
                >

                    <svg
                        viewBox="0 0 64 64"
                        role="img"
                        aria-hidden="true"
                    >

                        <!-- Outer lens -->
                        <circle
                            cx="29"
                            cy="29"
                            r="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="5"
                        />

                        <!-- Coin center -->
                        <circle
                            cx="29"
                            cy="29"
                            r="10"
                            fill="currentColor"
                            opacity="0.18"
                        />

                        <!-- Financial growth line -->
                        <path
                            d="M18 35 L26 27 L32 32 L43 20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <!-- Arrow head -->
                        <path
                            d="M37 20 H43 V26"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="4"
                            stroke-linecap="round"
                        />

                    </svg>

                </span>


                <span class="site-brand-name">
                    MoneyLens
                </span>

            </a>

        </div>


        <!-- =====================================================
             Main Application Navigation
             ===================================================== -->

        <nav
            class="site-navigation"
            aria-label="Main navigation"
        >

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('transactions') }}">
                Transactions
            </a>

            <a href="{{ url_for('budgets') }}">
                Budgets
            </a>


            <!-- =================================================
                 Logout Confirmation
                 ================================================= -->

            <details class="logout-menu">

                <summary>
                    Logout
                </summary>

                <div
                    class="logout-confirmation"
                    role="dialog"
                    aria-label="Logout confirmation"
                >

                    <div class="logout-confirmation-logo">

                        <svg
                            viewBox="0 0 64 64"
                            role="img"
                            aria-hidden="true"
                        >

                            <circle
                                cx="29"
                                cy="29"
                                r="20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="5"
                            />

                            <circle
                                cx="29"
                                cy="29"
                                r="10"
                                fill="currentColor"
                                opacity="0.18"
                            />

                            <path
                                d="M18 35 L26 27 L32 32 L43 20"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="4"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M37 20 H43 V26"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="4"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>


                    <div class="logout-confirmation-content">

                        <h2>
                            Log out of MoneyLens?
                        </h2>

                        <p>
                            Your current session will be ended.
                        </p>

                    </div>


                    <div class="logout-confirmation-actions">

                        <button
                            type="button"
                            class="logout-cancel"
                            onclick="this.closest('details').removeAttribute('open')"
                        >
                            Cancel
                        </button>

                        <a
                            href="{{ url_for('logout') }}"
                            class="logout-confirm-button"
                        >
                            Log Out
                        </a>

                    </div>

                </div>

            </details>

        </nav>

    </header>


    <!-- =========================================================
         Page Content
         ========================================================= -->

    <main>

        {% block content %}{% endblock %}

    </main>


    <!-- =========================================================
         Main JavaScript
         ========================================================= -->

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>

</html>
